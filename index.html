<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stride | Shoe Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <!-- Decorative background glows -->
  <span class="glow glow-1"></span>
  <span class="glow glow-2"></span>

  <div class="app">

    <header class="header">
      <a href="#" class="logo">Stride<span>.</span></a>
      <span class="header-note">New season · 2026</span>
    </header>

    <section class="intro">
      <span class="eyebrow">Collection</span>
      <h1>Find your <em>next step.</em></h1>
      <p>Fresh colors, clean lines and all-day comfort.</p>
    </section>

    <!-- JS adds the shoe cards here.

         Template of one card (3 samples are below so you can see the style; delete them when JS works):

         <article class="shoe-card">
           <span class="shoe-tag">New</span>                       (optional)
           <div class="shoe-img">
             <img src="img/shoe.png" alt="Sport Shoe">
           </div>
           <div class="shoe-body">
             <span class="shoe-category">Sport</span>
             <h3 class="shoe-name">Sport Shoe</h3>
             <p class="shoe-desc">Short description...</p>
             <div class="shoe-footer">
               <span class="shoe-price">$53</span>
               <button type="button" class="btn-more">See more <span>→</span></button>
             </div>
           </div>
         </article>

         Each card has its own color. Set it from JS with:
         cardElem.style.setProperty('--accent', item.color)
    -->
    <main class="shoe-grid" id="product-list">
      

    </main>

  </div>

  <script src="JS/main.js"></script>
</body>
</html>
